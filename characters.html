<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1119">
  <title>캐릭터 관리 · 환우협회 원대편성기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20260815-2">
  <link rel="stylesheet" href="auth.css?v=20260815-8">
  <link rel="stylesheet" href="characters.css?v=20260815-1">
  <link rel="stylesheet" href="characters-v2.css?v=20260815-3">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark">♿</span><span>환우협회 원대편성기</span></a>
    <div class="account">
      <div class="auth-user" id="authUser" hidden>
        <span class="account-name" id="accountName"></span>
        <label class="day-off-toggle"><input type="checkbox" id="dayOffToggle"><span>금일 휴무</span></label>
        <button class="icon-button" id="logoutButton" aria-label="로그아웃" title="로그아웃">↪</button>
        <img class="avatar" id="accountAvatar" alt="프로필">
      </div>
    </div>
  </header>

  <main class="manage-page">
    <a class="back-link" href="index.html">← 파티 구성으로 돌아가기</a>
    <section class="manage-heading">
      <div><span class="eyebrow">MY ROSTER</span><h1>내 캐릭터</h1><p>파티 구성에 사용할 캐릭터를 등록하고 관리하세요.</p></div>
      <div class="manage-actions"><button class="button button-muted" id="openColorPicker">내 컬러 설정</button><button class="button button-accent primary-action" id="newCharacter">＋ 새 캐릭터 등록</button></div>
    </section>

    <section class="roster-summary">
      <div><strong id="characterTotal">0</strong><span>전체 캐릭터</span></div>
      <div><strong id="dealerTotal">0</strong><span>격수</span></div>
      <div><strong id="supportTotal">0</strong><span>버프</span></div>
    </section>

    <section class="my-roster" id="myRoster" aria-live="polite"></section>
  </main>

  <dialog id="newCharacterDialog">
    <form id="newCharacterForm">
      <div class="dialog-title"><div><span class="eyebrow" id="dialogEyebrow">NEW CHARACTER</span><h2 id="dialogHeading">새 캐릭터 등록</h2></div><button class="icon-button" type="button" id="closeDialog" aria-label="닫기">×</button></div>
      <div class="form-grid role-form-grid">
        <label>역할군<select name="role" id="roleGroup"><option value="dps">격수</option><option value="buffer">버프</option></select></label>
        <label>격수 / 버프<select name="className" id="classChoice" required></select></label>
        <label class="full-field power-field" id="powerField">스공<input name="power" maxlength="20" placeholder="예: 5,280만"></label>
      </div>
      <p class="form-error" id="formError"></p>
      <div class="dialog-actions"><button class="button button-muted" type="button" id="cancelDialog">취소</button><button class="button button-accent" type="submit" id="saveCharacter">등록하기</button></div>
    </form>
  </dialog>

  <dialog id="colorDialog">
    <form id="colorForm">
      <div class="dialog-title"><div><span class="eyebrow">MY COLOR</span><h2>내 컬러 설정</h2></div><button class="icon-button" type="button" id="closeColor" aria-label="닫기">×</button></div>
      <p class="color-help">파티 카드 닉네임에 표시할 색상을 선택하세요. 다른 사용자가 고른 색상은 X로 표시됩니다.</p>
      <div class="color-palette" id="colorPalette"></div>
      <p class="form-error" id="colorError"></p>
      <div class="dialog-actions"><button class="button button-muted" type="button" id="cancelColor">취소</button><button class="button button-accent" type="submit" id="saveColor">저장하기</button></div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="characters.js?v=20260815-7"></script>
</body>
</html>
