<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1119">
  <title>메이플 파티</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20260815-2">
  <link rel="stylesheet" href="auth.css?v=20260815-2">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="Maple Party 홈">
      <span class="brand-mark">★</span><span>메이플 파티</span>
    </a>
    <div class="account">
      <button class="button google-login" id="googleLogin"><span class="google-mark">G</span>Google로 로그인</button>
      <div class="auth-user" id="authUser" hidden>
        <span class="account-name" id="accountName"></span>
        <button class="button button-muted" id="editNickname">별명 설정</button>
        <button class="button button-muted" id="manageCharacters">캐릭터 관리</button>
        <button class="icon-button" id="logoutButton" aria-label="로그아웃" title="로그아웃">↪</button>
        <img class="avatar" id="accountAvatar" alt="프로필">
      </div>
    </div>
  </header>

  <nav class="boss-tabs" id="bossTabs" aria-label="보스 선택"></nav>

  <main class="app-shell">
    <aside class="character-panel">
      <div class="panel-heading">
        <h2>캐릭터 목록</h2>
        <button class="add-icon" id="addCharacter" aria-label="캐릭터 추가">＋</button>
      </div>
      <label class="search-box">
        <span>⌕</span>
        <input id="characterSearch" type="search" placeholder="캐릭터 검색..." autocomplete="off">
      </label>
      <div id="characterGroups"></div>
    </aside>

    <section class="workspace">
      <div class="workspace-header">
        <div>
          <h1><span class="boss-dot"></span><span id="bossName"></span></h1>
          <p>보스 파티 구성</p>
        </div>
        <div class="workspace-actions">
          <div class="summary" id="summary"></div>
          <button class="button button-accent" id="addParty">＋ 파티 추가</button>
        </div>
      </div>
      <div class="party-list" id="partyList"></div>
    </section>
  </main>

  <dialog id="nicknameDialog">
    <form id="nicknameForm">
      <div class="dialog-title"><div><span class="eyebrow">MY PROFILE</span><h2>사이트 별명 설정</h2></div><button class="icon-button" type="button" id="closeNickname" aria-label="닫기">×</button></div>
      <label>별명<input name="nickname" id="nicknameInput" required maxlength="16" placeholder="사용할 별명"></label>
      <p class="form-error" id="nicknameError"></p>
      <div class="dialog-actions"><button class="button button-muted" type="button" id="cancelNickname">취소</button><button class="button button-accent" type="submit" id="saveNickname">저장하기</button></div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status"></div>
  <script src="data.js?v=20260815-3"></script>
  <script src="render.js?v=20260815-3"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js?v=20260815-6"></script>
</body>
</html>
